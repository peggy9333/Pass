`${common}<p>${app}</p>${ibon}<p>📌 台鐵指定車站：大林、民雄、嘉北、嘉義、水上、南靖。</p>`,
`${common}<p>${app}</p>${ibon}${d('台鐵指定車站','和平、和仁、崇德、新城、北埔、花蓮、吉安、志學、壽豐、豐田、林榮新光、南平、鳳林、萬榮、光復、大富、富源、瑞穗、三民、玉里、東里、東竹、富里')}<p>📌 花蓮轉運站</p><p>📌 指定鄉鎮公所：豐濱鄉公所、玉里鎮公所</p>`,
`${common}<p>${app}</p>${ibon}<p>📌 台鐵指定車站：池上、關山、瑞源、鹿野、山里、台東、康樂、知本、太麻里、金崙、瀧溪、大武</p><p><b>📌 旅遊服務中心：</b>臺東轉運站及臺東火車站的旅遊服務中心【三合一自助售票機】</p><p><b>📌 鄉鎮公所：</b>成功鎮公所及長濱鄉公所的【三合一自助售票機】</p>`,
`<div class="note">⚠️縣民公車／縣民車船卡優惠並非月票。</div>${common}<p>${app}</p><p>📌 馬公公車總站</p><p>📌 澎湖車船處交通船 馬公候船室</p><p>📌 澎湖車船處交通船 七美售票站</p><p>📌 澎湖車船處交通船 望安售票站</p><div class="info">澎湖方案無法透過 ibon 購買。</div>`,
southPurchase()

return `<section class="panel"><h2>${R[i]}｜購買方式</h2>${x[i]}</section>`;

function render(cat){
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
document.getElementById('content').innerHTML=`<section class="panel"><h2>${({fail:'無法購買月票',charged:'已買月票但無法使用，仍被扣款',activate:'月票怎麼啟用',purchase:'月票怎麼購買'})[cat]}</h2><p class="muted">請先選擇月票適用地區：</p>${regions()}</section><div id="answer"></div>`;
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{
document.querySelectorAll('[data-region]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
let i=+b.dataset.region,answer=document.getElementById('answer');
if(cat==='purchase'){answer.innerHTML=purchase(i);return;}
if(cat==='activate'){answer.innerHTML=`<section class="panel"><h2>${R[i]}｜月票啟用方式</h2>${i===9?'<div class="note"><b>新購或續約月票，皆需透過以下方式先啟用月票後才可搭乘（否則會扣卡內儲值金）：</b></div><ul><li>高雄捷運各車站服務台</li><li>7-11 ibon '+L('https://men-go.tw/#/Post/696','過卡說明')+'</li><li>iPASS MONEY APP過卡（僅支援PLUS卡）</li></ul>':'<p>定期票購買後，第一次靠卡搭乘交通工具時就會啟用月票，當次乘車也會計算在月票使用。</p><div class="info">📌除台鐵外的交通工具，進站／上車就會啟用月票，但台鐵要完成「進出站」刷卡才會啟用月票。（漏刷就不會啟用）</div><div class="note">📌YouBike站點無法啟用月票，需先啟用後再去租借，否則會扣卡內儲值金。</div>'}</section>`;return;}
if(cat==='charged'){charged(i,answer);return;}
fail(i,answer);
});
}
function fail(i,el){
let south=i===9;
el.innerHTML=`<section class="panel"><h2>${R[i]}｜確認卡片種類</h2>${south? southCards:otherCards}<p><b>請確認民眾持有的卡片是否符合上述說明：</b></p><div class="choices"><button class="choice" data-fit="yes">符合</button><button class="choice" data-fit="no">不符合</button></div><div id="sub"></div></section>`;
el.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{
el.querySelectorAll('[data-fit]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
let sub=el.querySelector('#sub');
if(b.dataset.fit==='no'){sub.innerHTML='<div class="result"><b>建議處理方式：</b>請更換為適用的卡片後，再購買月票。</div>';return;}
sub.innerHTML='<div class="result"><h3>請選擇購買通路</h3><div class="choices"><button class="choice" data-channel="ibon">ibon</button><button class="choice" data-channel="physical">台鐵／捷運／客運等實體據點</button><button class="choice" data-channel="app">iPASS MONEY APP</button></div><div id="channel"></div></div>';
sub.querySelectorAll('[data-channel]').forEach(c=>c.onclick=()=>channel(c.dataset.channel,south,sub.querySelector('#channel')));
});
}
function channel(ch,south,el){
if(ch==='physical'){el.innerHTML='<div class="result">實體據點的錯誤訊息僅供參考，若確認卡片狀態正常且餘額足夠，建議更換其他通路購買月票。</div>';return;}
if(ch==='app'){el.innerHTML='<div class="result"><h3>出現什麼錯誤訊息或錯誤狀況？</h3><div class="choices"><button class="choice" data-a="member">沒有註冊MeN Go帳號</button><button class="choice" data-a="balance">餘額不足</button></div><div id="detail"></div></div>';el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>el.querySelector('#detail').innerHTML=`<div class="result">${b.dataset.a==='member'?'購買南高屏月票需要先註冊MeN Go會員，請先註冊會員並綁定卡號後再購買。':'請先透過票卡感應機加值卡片，或連結iPASS MONEY以觸發自動加值功能。'}</div>`);return;}
el.innerHTML='<div class="result"><h3>出現什麼錯誤訊息或錯誤狀況？</h3><div class="choices"><button class="choice" data-e="a">此卡種無法用於購買月票</button><button class="choice" data-e="b">沒有對應方案可購買</button><button class="choice" data-e="c">餘額不足</button><button class="choice" data-e="d">無法感應</button></div><div id="detail"></div></div>';
el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
let k=b.dataset.e;
let msg={a:'1. 國小基隆樂學卡無法用於購買基隆月票。<br>2. 可能點錯 ibon 路徑（南高屏與南高屏以外的 ibon 路徑不同）。',b:'可能點錯 ibon 路徑（南高屏與南高屏以外的 ibon 路徑不同）。',c:south?'南高屏則不扣卡內餘額，去櫃台結帳。':'請先去超商櫃台加值。',d:'請去超商櫃台確認卡片是否能感應。'};
let path=south?`${S}<p>${L('https://men-go.tw/#/Post/689','南高屏 ibon 步驟圖')}</p><div class="note">購買完是去櫃台結帳付款，非ibon直接扣款。</div>`:`${O}<p>${video}</p><div class="note">${note}</div><p class="muted">影片示範為愛金卡，步驟相同。</p>`;
el.querySelector('#detail').innerHTML=`<div class="result"><b>建議處理方式：</b><p>${msg[k]}</p>${k==='a'||k==='b'?d('對應的 ibon 購買路徑',path):''}</div>`;
});
}
function charged(i,el){
el.innerHTML=`<section class="panel"><h2>${R[i]}｜排查方式</h2>${i===9?'<h3>1. 有無啟用月票？</h3><div class="choices"><button class="choice" data-q="not">沒有</button><button class="choice" data-q="late">沒有但已經超過啟用日</button><button class="choice" data-q="yes">有／不確定</button></div>':'<h3>1. 餘額是否為負值？</h3><div class="choices"><button class="choice" data-q="negative">是</button><button class="choice" data-q="ok">否</button></div>'}<div id="qresult"></div></section>`;
el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
let q=b.dataset.q,out=el.querySelector('#qresult');
if(q==='not'){out.innerHTML='<div class="result">請先去過卡啟用，才可使用月票。</div>';return;}
if(q==='late'){out.innerHTML='<div class="result">請洽MeN Go確認如何處理。</div>';return;}
if(q==='negative'){out.innerHTML='<div class="result">請去加值。</div>';return;}
if(i===9){out.innerHTML='<div class="result"><h3>2. 餘額是否為負值？</h3><div class="choices"><button class="choice" data-bal="neg">是</button><button class="choice" data-bal="ok">否</button></div><div id="bresult"></div></div>';out.querySelectorAll('[data-bal]').forEach(x=>x.onclick=()=>{out.querySelector('#bresult').innerHTML=x.dataset.bal==='neg'?'<div class="result">請去加值。</div>':'<div class="result"><h3>3. 搭乘什麼交通工具？</h3>'+rideOptions(i)+'</div>';rideBind(i,out.querySelector('#bresult'));});}
else{out.innerHTML='<div class="result"><h3>2. 搭乘什麼交通工具？</h3>'+rideOptions(i)+'</div>';rideBind(i,out);}
});
}
function rideOptions(i){return ridePlanPanel(i)}
function rideBind(i,el){
  const plan=el.querySelector('#ridePlan');
  const decision=el.querySelector('#rideDecision');
  plan.onchange=()=>{
    decision.style.display=plan.value?'block':'none';
    el.querySelector('#ride').innerHTML='';
    el.querySelectorAll('[data-ride]').forEach(x=>x.classList.remove('selected'));
  };
  el.querySelectorAll('[data-ride]').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('[data-ride]').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    const k=b.dataset.ride;
    let msg='';
    if(k==='out') msg='月票範圍外的乘車會使用卡內餘額扣款。';
    else if(k==='in') msg=i===9?'請洽MeN Go確認過卡是否有成功。':'開BTS單確認（但要等該筆搭車被扣款的交易紀錄回傳後再開單）。';
    else msg='請先向民眾確認搭乘的交通工具、路線、上車站及下車站，再依上方官方使用範圍核對；確認前先不要判定為月票範圍內或範圍外。';
    el.querySelector('#ride').innerHTML=`<div class="result"><b>已選方案：</b>${plan.value}<p><b>建議處理方式：</b>${msg}</p></div>`;
  });
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.cat));
render('fail');
</script></body></html>
